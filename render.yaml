services:
  - type: web
    name: taio-seo1ai
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LOCAL_MODE
        value: "0"
      - key: DAILY_LIMIT
        value: "5"
      - key: MAX_PARALLEL_CHECKS
        value: "2"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: MAX_PARALLEL_AI
        value: "2"
      - key: FETCH_TIMEOUT_SEC
        value: "15"
      - key: PSI_TIMEOUT_SEC
        value: "60"
      - key: PAGESPEED_API_KEY
        sync: false
